name: Publish local SDK assets

on:
  push:
    tags:
      - 'sdk-local-*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaged SDK assets
        uses: actions/checkout@v4

      - name: Verify packaged SDK assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c switchVK-26.1.4.tar.xz.sha256
          sha256sum -c switchVK-26.1.4-diagnostic.tar.xz.sha256
          test -s switchVK-26.1.4.tar.xz
          test -s switchVK-26.1.4-diagnostic.tar.xz

      - name: Publish Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: switchVK ${{ github.ref_name }}
          body: |
            Local SDK package published from the verified switchVK build.
            This release provides both release and diagnostic SDK variants for the GBAStation core builds.
          files: |
            release-assets/switchVK-26.1.4.tar.xz
            release-assets/switchVK-26.1.4.tar.xz.sha256
            release-assets/switchVK-26.1.4-diagnostic.tar.xz
            release-assets/switchVK-26.1.4-diagnostic.tar.xz.sha256
