name: Build switchVK SDK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-sdk:
    # NXVK's devkita64 image and the generated SDK are aarch64.  Use the
    # public GitHub ARM64 runner so Docker does not try to execute an ARM
    # toolchain through an unavailable x86 emulator.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out switchVK and NXVK
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build NXVK toolchain image
        run: docker build --tag switchvk-build nxvk-source/switch/docker

      - name: Build and verify release SDK
        env:
          SWITCHVK_JOBS: 4
        run: |
          set -euo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/.switchvk-build-release.log") 2>&1
          set -x
          mkdir -p .switchvk-tmp/spirv-tools-prefix
          docker run --rm \
            -v "$GITHUB_WORKSPACE/nxvk-source:/work" \
            -v "$GITHUB_WORKSPACE:/sdk" \
            -v "$GITHUB_WORKSPACE/.switchvk-tmp/spirv-tools-prefix:/work/spirv-tools-prefix" \
            -w /sdk \
            -e SWITCHVK_JOBS \
            -e DEVKITPRO=/opt/devkitpro \
            -e NXVK_SOURCE_DIR=/work \
            -e SPIRV_PREFIX=/work/spirv-tools-prefix \
            switchvk-build \
            bash -x /sdk/ci/build-sdk-in-container.sh

      - name: Package diagnostic SDK and archive both variants
        env:
          SWITCHVK_JOBS: 4
        run: |
          set -euo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/.switchvk-package.log") 2>&1
          set -x
          docker run --rm \
            -v "$GITHUB_WORKSPACE/nxvk-source:/work" \
            -v "$GITHUB_WORKSPACE:/sdk" \
            -v "$GITHUB_WORKSPACE/.switchvk-tmp/spirv-tools-prefix:/work/spirv-tools-prefix" \
            -w /sdk \
            -e DEVKITPRO=/opt/devkitpro \
            -e NXVK_SOURCE_DIR=/work \
            -e SPIRV_PREFIX=/work/spirv-tools-prefix \
            switchvk-build \
            bash -lc 'bash -x package_sdk.sh --source /work --build /work/switch/build/cross --output /sdk/nvk-switch-26.1.4-diagnostic --version 26.1.4 --variant diagnostic && bash -x verify_sdk.sh /sdk/nvk-switch-26.1.4-diagnostic'
          tar -cJf switchVK-26.1.4.tar.xz nvk-switch-26.1.4
          tar -cJf switchVK-26.1.4-diagnostic.tar.xz nvk-switch-26.1.4-diagnostic
          sha256sum switchVK-26.1.4.tar.xz > switchVK-26.1.4.tar.xz.sha256
          sha256sum switchVK-26.1.4-diagnostic.tar.xz > switchVK-26.1.4-diagnostic.tar.xz.sha256

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switchVK-${{ github.sha }}
          path: |
            switchVK-26.1.4.tar.xz
            switchVK-26.1.4.tar.xz.sha256
            switchVK-26.1.4-diagnostic.tar.xz
            switchVK-26.1.4-diagnostic.tar.xz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload SDK diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switchVK-build-diagnostics-${{ github.run_id }}
          path: |
            .switchvk-build-release.log
            .switchvk-package.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish SDK Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            switchVK-26.1.4.tar.xz
            switchVK-26.1.4.tar.xz.sha256
            switchVK-26.1.4-diagnostic.tar.xz
            switchVK-26.1.4-diagnostic.tar.xz.sha256
